name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      validation_tag:
        description: "Validation-only version (vX.Y.Z); never creates a tag or release"
        required: true
        type: string
        default: v0.1.51
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_tag || github.ref_name }}
jobs:
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Validate tag and main ancestry
        run: |
          node scripts/release-version.mjs --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
              test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
              ;;
            workflow_dispatch) test "$GITHUB_REF" = refs/heads/main ;;
            *) exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require successful full ARM CI for the exact release commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs
  build:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/goga-release-builder-cache
      GOGA_RELEASE_REPORT_DIR: ${{ github.workspace }}/work/release-report
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GOGA_TOPIC_READONLY_CLI: /nonexistent/disabled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and main ancestry before installing dependencies
        run: |
          node scripts/release-version.mjs --check
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
              test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
              ;;
            workflow_dispatch) test "$GITHUB_REF" = refs/heads/main ;;
            *) exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Assert native runner and Node architecture (never cross-build)
        run: |
          case "$EXPECTED_ARCH" in
            arm64) test "$(uname -m)" = arm64 ;;
            x64) test "$(uname -m)" = x86_64 ;;
            *) exit 1 ;;
          esac
          node -e 'if(process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - name: Identify native download cache toolchain
        id: toolchain
        run: echo "key=$( { sw_vers; xcrun clang --version; uname -m; } | shasum -a 256 | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache verified tool downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            work/terminal-native-build/downloads/electron
            work/terminal-native-build/home/.electron-gyp
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: release-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('package-lock.json', 'scripts/terminal-native-build.mjs') }}
      - name: Install locked dependencies
        run: node scripts/release-step.mjs install
      - run: npm run release:version
      - name: Build native application
        run: node scripts/release-step.mjs build
      - name: Package only this native architecture, without publishing
        run: node scripts/release-step.mjs package
      - name: Verify mounted DMG, signature, native runtime, versions and isolated UI
        run: |
          VERSION="$(node scripts/release-version.mjs --check)"
          node scripts/verify-dmg.mjs "release/Goga-Desktop-$VERSION-$EXPECTED_ARCH.dmg" "$EXPECTED_ARCH" --ui
          mkdir -p work/release-artifact
          cp "release/Goga-Desktop-$VERSION-$EXPECTED_ARCH.dmg" work/release-artifact/
        timeout-minutes: 4
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-diagnostics-${{ matrix.arch }}
          path: work/release-report/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dmg-${{ matrix.arch }}
          path: work/release-artifact/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dmg-arm64
          path: work/release-artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dmg-x64
          path: work/release-artifact
      - name: Recheck exact-commit CI before publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-ci.mjs
      - name: Create exact checksum manifest
        run: node scripts/publish-release.mjs manifest work/release-artifact
      - name: Draft, upload, verify server digests, then publish (never overwrite)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs publish work/release-artifact
