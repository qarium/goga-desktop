name: CI
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: git-workspace
            shard: 1
            count: 2
          - domain: git-workspace
            shard: 2
            count: 2
          - domain: git-conflicts
            shard: 1
            count: 8
          - domain: git-conflicts
            shard: 2
            count: 8
          - domain: git-conflicts
            shard: 3
            count: 8
          - domain: git-conflicts
            shard: 4
            count: 8
          - domain: git-conflicts
            shard: 5
            count: 8
          - domain: git-conflicts
            shard: 6
            count: 8
          - domain: git-conflicts
            shard: 7
            count: 8
          - domain: git-conflicts
            shard: 8
            count: 8
          - domain: git-safety
            shard: 1
            count: 1
          - domain: topics
            shard: 1
            count: 3
          - domain: topics
            shard: 2
            count: 3
          - domain: topics
            shard: 3
            count: 3
          - domain: terminal
            shard: 1
            count: 1
          - domain: launches
            shard: 1
            count: 1
          - domain: documents
            shard: 1
            count: 1
          - domain: shell
            shard: 1
            count: 1
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TEST_SHARD: ${{ matrix.shard }}/${{ matrix.count }}
      EXPECTED_ARCH: arm64
      GOGA_TEST_PROFILE: default
      GOGA_TOPIC_READONLY_CLI: /nonexistent/disabled
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GOGA_CI_DOMAIN: ${{ matrix.domain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Assert native runner and Node architecture
        run: |
          case "$EXPECTED_ARCH" in
            arm64) test "$(uname -m)" = arm64 ;;
            x64) test "$(uname -m)" = x86_64 ;;
            *) exit 1 ;;
          esac
          node -e 'if(process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci
      - name: Tests (native Goga CLI deliberately unavailable)
        id: tests
        run: |
          mkdir -p work
          npm test -- --maxWorkers=3 --testTimeout=15000 --shard="$TEST_SHARD" --reporter=verbose --reporter=json --outputFile=work/vitest.json
      - name: Exact skipped test report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/test-summary.mjs work/vitest.json
    name: ${{ matrix.domain }} (${{ matrix.shard }}/${{ matrix.count }})
  git-compatibility:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GOGA_TOPIC_READONLY_CLI: /nonexistent/disabled
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GOGA_COMPAT_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Identify native Git build toolchain
        id: toolchain
        run: echo "key=$( { sw_vers; xcrun clang --version; uname -m; } | shasum -a 256 | cut -d" " -f1)" >> "$GITHUB_OUTPUT"
      - name: Cache isolated Git build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ runner.temp }}/goga-git-compatibility/install
          key: git-2.45.2-51bfe87e-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/build-ci-git.sh') }}
      - name: Build or validate isolated lower-version Git (system Git stays unchanged)
        run: bash scripts/build-ci-git.sh
      - name: Native Git compatibility
        id: compatibility
        run: |
          mkdir -p work
          node --version
          git --version
          node scripts/test-git-compatibility.mjs
      - name: Compatibility test report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.compatibility.outcome }}
        run: node scripts/test-summary.mjs work/git-compatibility.json
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
  check:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      EXPECTED_ARCH: arm64
      GOGA_TEST_PROFILE: default
      GOGA_TOPIC_READONLY_CLI: /nonexistent/disabled
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Assert native runner and Node architecture
        run: |
          case "$EXPECTED_ARCH" in
            arm64) test "$(uname -m)" = arm64 ;;
            x64) test "$(uname -m)" = x86_64 ;;
            *) exit 1 ;;
          esac
          node -e 'if(process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run build
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - tests
      - git-compatibility
      - check
    if: always()
    steps:
      - name: Require every domain, compatibility group and build
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e "const results=JSON.parse(process.env.RESULTS); if(Object.values(results).some(j=>j.result !== 'success')) { console.error('CI verification incomplete or failed',results); process.exit(1); }"
