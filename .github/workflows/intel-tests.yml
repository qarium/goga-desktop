name: Intel tests (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: intel-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      TEST_SHARD: ${{ matrix.shard }}/8
      EXPECTED_ARCH: x64
      GOGA_TEST_PROFILE: slow-git
      GOGA_TOPIC_READONLY_CLI: /nonexistent/disabled
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Assert native runner and Node architecture
        run: |
          case "$EXPECTED_ARCH" in
            arm64) test "$(uname -m)" = arm64 ;;
            x64) test "$(uname -m)" = x86_64 ;;
            *) exit 1 ;;
          esac
          node -e 'if(process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci
      - name: Tests (native Goga CLI deliberately unavailable)
        id: tests
        run: |
          mkdir -p work
          npm test -- --maxWorkers=1 --testTimeout=15000 --shard="$TEST_SHARD" --reporter=verbose --reporter=json --outputFile=work/vitest.json
      - name: Exact skipped test report
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: node scripts/test-summary.mjs work/vitest.json
  check:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      EXPECTED_ARCH: x64
      GOGA_TEST_PROFILE: slow-git
      GOGA_TOPIC_READONLY_CLI: /nonexistent/disabled
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Assert native runner and Node architecture
        run: |
          case "$EXPECTED_ARCH" in
            arm64) test "$(uname -m)" = arm64 ;;
            x64) test "$(uname -m)" = x86_64 ;;
            *) exit 1 ;;
          esac
          node -e 'if(process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
      - run: npm ci
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm run build
